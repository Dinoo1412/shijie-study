<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="拾阶工程学习平台：AI Agent、C++ 后端、算法训练，课程与实践记录随账号同步。">
  <title>拾阶 · 工程学习平台</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="curriculum.js"></script>
  <script defer src="algorithm-data.js"></script>
  <script defer src="algorithm-state.js"></script>
  <script defer src="backend-data.js"></script>
  <script defer src="backend-state.js"></script>
  <script defer src="app.js"></script>
  <script defer src="algorithms.js"></script>
  <script defer src="platform.js"></script>
  <script defer src="account.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a href="#dashboard" class="brand"><span class="brand-mark">拾</span><span>拾阶<small>一步一步，写出自己的答案。</small></span></a>
    <div class="sidebar-label">学习空间</div>
    <nav aria-label="主导航">
      <a href="#dashboard" data-nav="dashboard" class="nav-home"><span>◈</span>学习总览</a>
      <section class="nav-section" data-section="ai" aria-label="AI Agent 学习导航">
        <button class="nav-toggle nav-group-button" data-toggle="ai" aria-expanded="true" aria-controls="nav-ai"><span class="nav-group-icon">↗</span><strong>AI Agent</strong><span class="nav-chevron">⌄</span></button>
        <div class="nav-children" id="nav-ai">
          <a href="#ai" data-nav="ai">学习工作台</a>
          <a href="#roadmap" data-nav="roadmap">成长路线</a>
          <a href="#lessons" data-nav="lessons">每日课程</a>
          <a href="#projects" data-nav="projects">实战项目</a>
          <a href="#notes" data-nav="notes">课程笔记</a>
          <a href="#resources" data-nav="resources">资料书架</a>
        </div>
      </section>
      <section class="nav-section" data-section="cpp" aria-label="C++ 后端学习导航">
        <button class="nav-toggle nav-group-button" data-toggle="cpp" aria-expanded="true" aria-controls="nav-cpp"><span class="nav-group-icon">⌘</span><strong>C++ 后端</strong><span class="nav-chevron">⌄</span></button>
        <div class="nav-children" id="nav-cpp">
          <a href="#cpp-backend" data-nav="cpp-backend">学习工作台</a>
          <a href="#cpp-roadmap" data-nav="cpp-roadmap">学习路线</a>
          <a href="#cpp-lessons" data-nav="cpp-lessons">实践课程</a>
          <a href="#cpp-projects" data-nav="cpp-projects">实战项目</a>
          <a href="#cpp-notes" data-nav="cpp-notes">学习笔记</a>
          <a href="#cpp-resources" data-nav="cpp-resources">资料书架</a>
        </div>
      </section>
      <section class="nav-section" data-section="algorithms" aria-label="算法训练导航">
        <a href="#algorithms?tab=collections" data-nav="algorithms" class="nav-entry"><span>⌁</span>算法训练</a>
      </section>
    </nav>
    <div class="sidebar-bottom"><a href="#settings" data-nav="settings">⚙ 账号与备份</a><span id="save-state" role="status">● 已在本机保存</span></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div><span class="tiny">LEARNING / </span><span id="page-label">学习工作台</span></div><div class="top-actions"><span id="today-date"></span><button id="focus-open" class="button compact">◷ 专注学习</button></div></header>
    <main id="main" tabindex="-1"></main>
    <footer>拾阶 / AI Agent · C++ 后端 · 算法训练 <span>登录后跨设备同步 · 定期导出备份</span></footer>
  </div>
  <dialog id="focus-dialog" aria-labelledby="focus-title"><div class="dialog-top"><span class="eyebrow">ONE THING AT A TIME</span><button class="icon-button" id="focus-close" aria-label="关闭专注面板">×</button></div><h2 id="focus-title">给自己一段专注的时间</h2><p id="focus-task"></p><div class="timer" id="timer-display">25:00</div><label class="field">专注时长<select id="focus-duration"><option value="15">15 分钟</option><option value="25" selected>25 分钟</option><option value="45">45 分钟</option></select></label><div class="button-row"><button class="button primary" id="timer-start">开始专注</button><button class="button" id="timer-stop">结束并记录</button></div><p class="muted small">关闭面板后计时仍会继续。达到目标会自动记录学习时间。</p></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>请启用浏览器的 JavaScript，才能使用课程、笔记和进度记录。</noscript>
</body>
</html>
